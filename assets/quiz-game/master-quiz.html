<style>

  :root {
    --bg: #f8f9fa;
    --bg-alt: #eef1f5;
    --card: #ffffff;
    --card-hover: #f0f4f8;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --correct: #16a34a;
    --correct-light: #dcfce7;
    --correct-border: #86efac;
    --incorrect: #dc2626;
    --incorrect-light: #fee2e2;
    --incorrect-border: #fca5a5;
    --text: #1e293b;
    --text-body: #334155;
    --text-dim: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --warn: #f59e0b;
    --warn-light: #fef3c7;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text-body);
    min-height: 100vh;
    line-height: 1.65;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Top bar */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .topbar-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .logo {
    font-size: 1.15em; font-weight: 700; color: var(--primary);
    letter-spacing: -0.02em;
  }
  .topbar .logo-sub {
    font-size: 0.78em; color: var(--text-dim); font-weight: 400;
  }

  #app {
    max-width: 820px; margin: 0 auto; padding: 28px 24px 60px;
  }

  /* ---------- Start Screen ---------- */
  .start-screen { text-align: center; }
  .start-hero {
    background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
    color: #fff; border-radius: var(--radius); padding: 36px 28px;
    box-shadow: var(--shadow-lg); margin-bottom: 28px;
  }
  .start-hero h1 {
    font-size: 1.6em; font-weight: 800; letter-spacing: -0.03em;
    margin-bottom: 10px; line-height: 1.25;
  }
  .start-hero .tagline {
    font-size: 0.95em; opacity: 0.9; max-width: 480px; margin: 0 auto;
    line-height: 1.5;
  }
  .start-stats {
    display: flex; justify-content: center; gap: 28px;
    margin-top: 20px; padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.2);
  }
  .start-stats .stat { text-align: center; }
  .start-stats .stat-num { font-size: 1.7em; font-weight: 800; }
  .start-stats .stat-label { font-size: 0.78em; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }

  .mode-cards { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 0 auto; }
  .mode-btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 20px 22px;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 1.02em; cursor: pointer; transition: all 0.18s ease;
    text-align: left; box-shadow: var(--shadow-sm);
  }
  .mode-btn:hover {
    border-color: var(--primary); box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .mode-btn .icon {
    font-size: 1.5em; flex-shrink: 0; width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    background: var(--primary-light); border-radius: 12px;
  }
  .mode-btn .btn-content { flex: 1; }
  .mode-btn .btn-title { font-weight: 700; font-size: 1.05em; }
  .mode-btn .btn-desc {
    display: block; font-size: 0.85em; color: var(--text-dim);
    margin-top: 3px; font-weight: 400;
  }

  /* ---------- Category Select ---------- */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-header h2 {
    font-size: 1.3em; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em;
  }
  .back-btn {
    padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-dim); font-size: 0.88em;
    cursor: pointer; transition: all 0.15s; font-weight: 500;
  }
  .back-btn:hover { border-color: var(--border-strong); color: var(--text); }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .cat-card {
    padding: 18px 16px; background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all 0.18s ease;
    text-align: center; box-shadow: var(--shadow-sm);
  }
  .cat-card:hover {
    border-color: var(--primary); box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .cat-card .emoji { font-size: 2em; margin-bottom: 8px; }
  .cat-card .name {
    font-weight: 700; font-size: 0.92em; color: var(--text);
    margin-bottom: 4px; letter-spacing: -0.01em;
  }
  .cat-card .desc {
    font-size: 0.78em; color: var(--text-dim); line-height: 1.4;
    margin-bottom: 8px;
  }
  .cat-card .count {
    font-size: 0.75em; color: var(--primary); font-weight: 600;
    background: var(--primary-light); padding: 2px 10px;
    border-radius: 20px; display: inline-block;
  }

  /* ---------- Quiz Screen ---------- */
  .quiz-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
  }
  .progress-bar {
    flex: 1; height: 10px; background: var(--bg-alt);
    border-radius: 6px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), #7c3aed);
    border-radius: 6px; transition: width 0.35s ease;
  }
  .progress-text {
    color: var(--text-dim); font-size: 0.85em; font-weight: 600;
    white-space: nowrap;
  }

  .category-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; background: var(--primary-light);
    border-radius: 20px; font-size: 0.82em; font-weight: 600;
    color: var(--primary-dark); margin-bottom: 16px;
  }

  .question-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 28px 24px;
    box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .question-text {
    font-size: 1.18em; color: var(--text); font-weight: 600;
    line-height: 1.5; margin-bottom: 22px; letter-spacing: -0.01em;
  }

  .option-btn {
    display: block; width: 100%; padding: 16px 18px; margin-bottom: 10px;
    background: var(--card); border: 2px solid var(--border);
    border-radius: 12px; color: var(--text-body); font-size: 0.98em;
    cursor: pointer; transition: all 0.15s ease; text-align: left;
    font-family: inherit; line-height: 1.5;
  }
  .option-btn:hover:not(.disabled) {
    border-color: var(--primary); background: var(--card-hover);
  }
  .option-btn.selected {
    border-color: var(--primary); background: var(--primary-light);
  }
  .option-btn.correct {
    border-color: var(--correct-border); background: var(--correct-light);
  }
  .option-btn.incorrect {
    border-color: var(--incorrect-border); background: var(--incorrect-light);
  }
  .option-btn.disabled { cursor: default; }
  .option-letter {
    font-weight: 700; margin-right: 10px; color: var(--primary);
    font-size: 0.95em;
  }
  .option-btn.correct .option-letter { color: var(--correct); }
  .option-btn.incorrect .option-letter { color: var(--incorrect); }

  .explanation {
    margin-top: 16px; padding: 18px 20px; background: var(--bg-alt);
    border: 1px solid var(--border); border-left: 4px solid var(--primary);
    border-radius: 12px; font-size: 0.92em; color: var(--text-body);
    line-height: 1.6; display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--text); }
  .explanation .result-correct { color: var(--correct); font-weight: 700; }
  .explanation .result-incorrect { color: var(--incorrect); font-weight: 700; }

  .nav-buttons {
    display: flex; gap: 10px; margin-top: 22px; align-items: center;
  }
  .nav-btn {
    padding: 12px 24px; border: none; border-radius: 10px;
    font-size: 0.95em; font-family: inherit; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease;
  }
  .nav-btn.primary {
    background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(37,99,235,0.3);
  }
  .nav-btn.primary:hover { background: var(--primary-dark); }
  .nav-btn.secondary {
    background: var(--card); color: var(--text-body);
    border: 1.5px solid var(--border);
  }
  .nav-btn.secondary:hover { border-color: var(--border-strong); background: var(--card-hover); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.hidden { display: none; }
  .nav-spacer { flex: 1; }

  /* ---------- Results Screen ---------- */
  .results-screen { text-align: center; }
  .results-hero {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 32px 24px;
    box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .results-hero h2 {
    font-size: 1.5em; font-weight: 800; color: var(--text);
    margin-bottom: 6px; letter-spacing: -0.02em;
  }
  .results-hero .mode-label { color: var(--text-dim); font-size: 0.9em; }
  .score-circle {
    width: 130px; height: 130px; border-radius: 50%; margin: 24px auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4em; font-weight: 800; border: 4px solid;
    letter-spacing: -0.03em;
  }
  .score-circle.high { border-color: var(--correct); color: var(--correct); background: var(--correct-light); }
  .score-circle.mid  { border-color: var(--warn); color: var(--warn); background: var(--warn-light); }
  .score-circle.low  { border-color: var(--incorrect); color: var(--incorrect); background: var(--incorrect-light); }
  .results-hero .score-detail {
    font-size: 1.15em; color: var(--text); font-weight: 600; margin-bottom: 4px;
  }

  .breakdown-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 22px 24px;
    box-shadow: var(--shadow-sm); margin-bottom: 24px;
  }
  .breakdown-card h3 {
    font-size: 1.05em; font-weight: 700; color: var(--text);
    margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.92em;
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .cat { color: var(--text-body); }
  .breakdown-row .score { font-weight: 700; font-size: 0.9em; }
  .breakdown-row .score.all-correct { color: var(--correct); }
  .breakdown-row .score.some-wrong { color: var(--warn); }
  .breakdown-row .score.all-wrong { color: var(--incorrect); }
  .breakdown-bar {
    width: 80px; height: 6px; background: var(--bg-alt);
    border-radius: 3px; overflow: hidden; margin-left: 10px;
  }
  .breakdown-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

  .review-section { margin-top: 8px; text-align: left; }
  .review-section h3 {
    font-size: 1.05em; font-weight: 700; color: var(--text);
    margin-bottom: 14px; letter-spacing: -0.01em;
  }
  .review-item {
    padding: 16px 18px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; border-left: 4px solid var(--incorrect);
    box-shadow: var(--shadow-sm);
  }
  .review-item.correct { border-left-color: var(--correct); }
  .review-item .q {
    font-weight: 600; margin-bottom: 8px; color: var(--text);
    font-size: 0.95em; line-height: 1.45;
  }
  .review-item .a { font-size: 0.88em; color: var(--text-dim); line-height: 1.55; }
  .review-item .your-answer { color: var(--incorrect); font-weight: 600; }
  .review-item .correct-answer { color: var(--correct); font-weight: 600; }
  .review-item .explanation-text {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    color: var(--text-body); font-size: 0.86em;
  }

  .results-actions {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin-top: 28px;
  }

  /* Footer */
  .footer {
    text-align: center; padding: 24px; color: var(--text-light);
    font-size: 0.8em; line-height: 1.5;
  }
  .footer a { color: var(--primary); text-decoration: none; }

  @media (max-width: 640px) {
    body { font-size: 15px; }
    #app { padding: 20px 16px 50px; }
    .start-hero { padding: 28px 20px; }
    .start-hero h1 { font-size: 1.35em; }
    .start-stats { gap: 18px; }
    .question-text { font-size: 1.05em; }
    .category-grid { grid-template-columns: 1fr; }
    .mode-btn { padding: 16px 18px; }
    .question-card { padding: 20px 18px; }
  }

</style>

// --- State ---
let state = {
  screen: 'start',
  mode: null,
  questionOrder: [],
  currentIdx: 0,
  answers: [],
  selectedOption: null,
  showExplanation: false,
};

// --- Helpers ---
function getByCategory(cat) {
  return QUIZ_DATA.questions
    .map((q, i) => ({ q, i }))
    .filter(x => x.q.category === cat)
    .map(x => x.i);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Render ---
const app = document.getElementById('app');

function render() {
  if (state.screen === 'start') renderStart();
  else if (state.screen === 'category-select') renderCategorySelect();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'results') renderResults();
}

function renderStart() {
  app.innerHTML = `
    <div class="start-screen">
      <div class="start-hero">
        <h1>${esc(QUIZ_DATA.title)}</h1>
        <p class="tagline">${esc(QUIZ_DATA.subtitle)}</p>
        <div class="start-stats">
          <div class="stat"><div class="stat-num">${QUIZ_DATA.questions.length}</div><div class="stat-label">Questions</div></div>
          <div class="stat"><div class="stat-num">${QUIZ_DATA.categories.length}</div><div class="stat-label">Categories</div></div>
          <div class="stat"><div class="stat-num">4</div><div class="stat-label">Options Each</div></div>
        </div>
      </div>
      <div class="mode-cards">
        <button class="mode-btn" onclick="startAll()">
          <span class="icon">🎯</span>
          <span class="btn-content">
            <span class="btn-title">Play All Questions</span>
            <span class="btn-desc">All ${QUIZ_DATA.questions.length} questions in shuffled order</span>
          </span>
        </button>
        <button class="mode-btn" onclick="goCategorySelect()">
          <span class="icon">📚</span>
          <span class="btn-content">
            <span class="btn-title">Choose a Category</span>
            <span class="btn-desc">Focus on one topic — pick from ${QUIZ_DATA.categories.length} categories</span>
          </span>
        </button>
      </div>
    </div>
  `;
}

function goCategorySelect() {
  state.screen = 'category-select';
  render();
}

function renderCategorySelect() {
  const cards = QUIZ_DATA.categories.map(c => {
    const count = getByCategory(c.name).length;
    return `
      <div class="cat-card" onclick="startCategory('${esc(c.name)}')">
        <div class="emoji">${c.emoji}</div>
        <div class="name">${esc(c.name)}</div>
        <div class="desc">${esc(c.description)}</div>
        <span class="count">${count} questions</span>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="section-header">
      <h2>Select a Category</h2>
      <button class="back-btn" onclick="state.screen='start'; render();">← Back</button>
    </div>
    <div class="category-grid">${cards}</div>
  `;
}

function startAll() {
  state.mode = 'all';
  state.questionOrder = shuffle([...Array(QUIZ_DATA.questions.length).keys()]);
  state.currentIdx = 0;
  state.answers = [];
  state.selectedOption = null;
  state.showExplanation = false;
  state.screen = 'quiz';
  render();
}

function startCategory(cat) {
  state.mode = cat;
  state.questionOrder = shuffle(getByCategory(cat));
  state.currentIdx = 0;
  state.answers = [];
  state.selectedOption = null;
  state.showExplanation = false;
  state.screen = 'quiz';
  render();
}

function renderQuiz() {
  const qi = state.questionOrder[state.currentIdx];
  const q = QUIZ_DATA.questions[qi];
  const progress = ((state.currentIdx + 1) / state.questionOrder.length) * 100;
  const cat = QUIZ_DATA.categories.find(c => c.name === q.category);
  const answered = state.answers[state.currentIdx];

  const optionsHTML = q.options.map((opt, i) => {
    let cls = 'option-btn';
    if (answered) {
      cls += ' disabled';
      if (i === q.correct) cls += ' correct';
      else if (i === answered.selected) cls += ' incorrect';
    } else if (state.selectedOption === i) {
      cls += ' selected';
    }
    const letter = String.fromCharCode(65 + i);
    return `<button class="${cls}" onclick="selectOption(${i})" ${answered ? 'disabled' : ''}>
      <span class="option-letter">${letter}</span>${esc(opt)}
    </button>`;
  }).join('');

  let explHTML = '';
  if (state.showExplanation && answered) {
    const isCorrect = answered.selected === q.correct;
    explHTML = `
      <div class="explanation show">
        <strong class="${isCorrect ? 'result-correct' : 'result-incorrect'}">${isCorrect ? '✅ Correct!' : '❌ Incorrect.'}</strong><br>
        <strong>Answer:</strong> ${String.fromCharCode(65 + q.correct)}) ${esc(q.options[q.correct])}<br><br>
        ${esc(q.explanation)}<br><br>
        <a href="${q.reference}" target="_blank" rel="noopener" style="color:var(--primary);font-size:0.85em;text-decoration:none;">📖 ${esc(q.ref_source)} ↗</a>
      </div>
    `;
  }

  const isLast = state.currentIdx === state.questionOrder.length - 1;
  const hasAnswered = !!answered;

  app.innerHTML = `
    <div class="quiz-header">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <span class="progress-text">${state.currentIdx + 1} / ${state.questionOrder.length}</span>
    </div>
    <span class="category-badge">${cat ? cat.emoji : ''} ${esc(q.category)}</span>
    <div class="question-card">
      <div class="question-text">${esc(q.question)}</div>
      ${optionsHTML}
      ${explHTML}
    </div>
    <div class="nav-buttons">
      <button class="nav-btn secondary ${state.currentIdx === 0 ? 'hidden' : ''}" onclick="prevQuestion()">← Previous</button>
      <span class="nav-spacer"></span>
      ${!hasAnswered
        ? `<button class="nav-btn primary" onclick="submitAnswer()" ${state.selectedOption === null ? 'disabled' : ''}>Check Answer</button>`
        : isLast
          ? `<button class="nav-btn primary" onclick="finishQuiz()">See Results →</button>`
          : `<button class="nav-btn primary" onclick="nextQuestion()">Next →</button>`
      }
    </div>
  `;
}

function selectOption(i) {
  if (state.answers[state.currentIdx]) return;
  state.selectedOption = i;
  render();
}

function submitAnswer() {
  if (state.selectedOption === null) return;
  const qi = state.questionOrder[state.currentIdx];
  const q = QUIZ_DATA.questions[qi];
  const isCorrect = state.selectedOption === q.correct;
  state.answers[state.currentIdx] = {
    questionIndex: qi,
    selected: state.selectedOption,
    correct: isCorrect
  };
  state.showExplanation = true;
  render();
}

function nextQuestion() {
  if (state.currentIdx < state.questionOrder.length - 1) {
    state.currentIdx++;
    state.selectedOption = null;
    state.showExplanation = false;
    render();
  }
}

function prevQuestion() {
  if (state.currentIdx > 0) {
    state.currentIdx--;
    state.selectedOption = state.answers[state.currentIdx]?.selected ?? null;
    state.showExplanation = !!state.answers[state.currentIdx];
    render();
  }
}

function finishQuiz() {
  state.screen = 'results';
  render();
}

function renderResults() {
  const total = state.questionOrder.length;
  const correctCount = state.answers.filter(a => a.correct).length;
  const pct = Math.round((correctCount / total) * 100);
  const scoreClass = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';

  const catStats = {};
  state.answers.forEach(a => {
    const q = QUIZ_DATA.questions[a.questionIndex];
    if (!catStats[q.category]) catStats[q.category] = { correct: 0, total: 0 };
    catStats[q.category].total++;
    if (a.correct) catStats[q.category].correct++;
  });

  const breakdownHTML = Object.entries(catStats).map(([cat, stats]) => {
    const catObj = QUIZ_DATA.categories.find(c => c.name === cat);
    const ratio = stats.correct / stats.total;
    const scoreCls = ratio === 1 ? 'all-correct' : ratio === 0 ? 'all-wrong' : 'some-wrong';
    const barColor = ratio === 1 ? 'var(--correct)' : ratio === 0 ? 'var(--incorrect)' : 'var(--warn)';
    return `<div class="breakdown-row">
      <span class="cat">${catObj ? catObj.emoji : ''} ${esc(cat)}</span>
      <span style="display:flex; align-items:center;">
        <span class="breakdown-bar"><span class="breakdown-bar-fill" style="width:${ratio*100}%; background:${barColor};"></span></span>
        <span class="score ${scoreCls}" style="margin-left:8px;">${stats.correct}/${stats.total}</span>
      </span>
    </div>`;
  }).join('');

  const wrongAnswers = state.answers.filter(a => !a.correct);
  let reviewHTML = '';
  if (wrongAnswers.length > 0) {
    const reviewItems = wrongAnswers.map(a => {
      const q = QUIZ_DATA.questions[a.questionIndex];
      return `<div class="review-item incorrect">
        <div class="q">${esc(q.question)}</div>
        <div class="a">
          <span class="your-answer">Your answer: ${String.fromCharCode(65 + a.selected)}) ${esc(q.options[a.selected])}</span><br>
          <span class="correct-answer">Correct: ${String.fromCharCode(65 + q.correct)}) ${esc(q.options[q.correct])}</span>
          <div class="explanation-text">${esc(q.explanation)}<br><br><a href="${q.reference}" target="_blank" rel="noopener" style="color:var(--primary);font-size:0.85em;text-decoration:none;">📖 ${esc(q.ref_source)} ↗</a></div>
        </div>
      </div>`;
    }).join('');
    reviewHTML = `
      <div class="review-section">
        <div class="breakdown-card">
          <h3>📖 Review Missed Questions (${wrongAnswers.length})</h3>
          ${reviewItems}
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="results-screen">
      <div class="results-hero">
        <h2>Quiz Complete!</h2>
        <p class="mode-label">${esc(state.mode === 'all' ? 'All Categories' : state.mode)}</p>
        <div class="score-circle ${scoreClass}">${pct}%</div>
        <p class="score-detail">${correctCount} out of ${total} correct</p>
      </div>
      <div class="breakdown-card">
        <h3>📊 Category Breakdown</h3>
        ${breakdownHTML}
      </div>
      ${reviewHTML}
      <div class="results-actions">
        <button class="nav-btn primary" onclick="startAll()">🔄 Play Again (All)</button>
        <button class="nav-btn secondary" onclick="goCategorySelect()">📚 Choose Category</button>
        <button class="nav-btn secondary" onclick="state.screen='start'; render();">🏠 Home</button>
      </div>
    </div>
  `;
}

// Init
render();
</script>
</body>
</html>
